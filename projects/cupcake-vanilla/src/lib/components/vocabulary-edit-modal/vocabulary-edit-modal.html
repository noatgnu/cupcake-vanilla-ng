<div class="modal-header py-2">
  <h6 class="modal-title mb-0">{{ vocabulary ? 'Edit ' + vocabulary!.label : 'New vocabulary' }}</h6>
  <button type="button" class="btn-close" (click)="activeModal.dismiss()"></button>
</div>
<form [formGroup]="form" (ngSubmit)="save()">
  <div class="modal-body small">
    <div class="mb-2">
      <label class="form-label mb-1" for="vocabularyLabel">Label</label>
      <input id="vocabularyLabel" class="form-control form-control-sm" formControlName="label">
    </div>
    @if (!vocabulary) {
      <div class="row g-2 mb-2">
        <div class="col-7">
          <label class="form-label mb-1" for="vocabularySlug">Key</label>
          <div class="input-group input-group-sm">
            <span class="input-group-text">custom.</span>
            <input id="vocabularySlug" class="form-control" formControlName="slug" placeholder="made from the label">
          </div>
        </div>
        <div class="col-5">
          <label class="form-label mb-1" for="vocabularyLabGroup">Available to</label>
          <select id="vocabularyLabGroup" class="form-select form-select-sm" formControlName="labGroup">
            @if (canCreateGlobal) {
              <option value="">Everyone</option>
            }
            @for (group of managedLabGroups; track group.id) {
              <option [value]="group.id">{{ group.name }}</option>
            }
          </select>
        </div>
      </div>
      @if (form.controls.slug.invalid) {
        <div class="text-danger mb-2">Use lower-case letters, digits and underscores.</div>
      }
    }
    <div class="row g-2 mb-2">
      <div class="col-6">
        <label class="form-label mb-1" for="vocabularyKind">Kind of term</label>
        <input id="vocabularyKind" class="form-control form-control-sm" formControlName="kind" placeholder="for example strain">
      </div>
      <div class="col-6">
        <label class="form-label mb-1" for="vocabularySdrf">SDRF short name</label>
        <input id="vocabularySdrf" class="form-control form-control-sm" formControlName="sdrfShortName" placeholder="for example LAB">
      </div>
    </div>
    <div class="mb-2">
      <label class="form-label mb-1" for="vocabularyDescription">Description</label>
      <textarea id="vocabularyDescription" class="form-control form-control-sm" rows="2" formControlName="description"></textarea>
    </div>
    @if (vocabulary) {
      <div class="form-check form-switch">
        <input id="vocabularyUnavailable" class="form-check-input" type="checkbox"
               [checked]="form.controls.status.value === 'unavailable'"
               (change)="form.controls.status.setValue($any($event.target).checked ? 'unavailable' : 'active')">
        <label class="form-check-label" for="vocabularyUnavailable">Unavailable for new columns</label>
      </div>
    }
  </div>
  <div class="modal-footer py-2">
    <button type="button" class="btn btn-sm btn-outline-secondary" (click)="activeModal.dismiss()">Cancel</button>
    <button type="submit" class="btn btn-sm btn-primary" [disabled]="saving() || form.invalid">
      {{ vocabulary ? 'Save' : 'Create' }}
    </button>
  </div>
</form>
